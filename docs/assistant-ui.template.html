<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
  :root {
    --ground: #eceff3; --surface: #ffffff; --surface-2: #f4f6f9; --line: #d8dee6;
    --ink: #17222e; --ink-2: #4c5c6d; --ink-3: #74869a;
    --them: #ffffff; --ai: #dfeaf5; --ai-ink: #16334d;
    --memory: #1c6b53; --memory-bg: #e4f1ec;
    --skill: #3f4fae; --skill-bg: #e7e9f8;
    --flag: #a2481c; --flag-bg: #fae8e0;
    --sans: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Source Serif 4", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0f151c; --surface: #16202b; --surface-2: #1c2836; --line: #2b3949;
      --ink: #e9eef4; --ink-2: #b2c0cf; --ink-3: #8698aa;
      --them: #1c2836; --ai: #1b3a53; --ai-ink: #dbeaf7;
      --memory: #63c6a6; --memory-bg: #10322a; --skill: #96a2ee; --skill-bg: #1c2145;
      --flag: #e9a184; --flag-bg: #3a201a;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0f151c; --surface: #16202b; --surface-2: #1c2836; --line: #2b3949;
    --ink: #e9eef4; --ink-2: #b2c0cf; --ink-3: #8698aa;
    --them: #1c2836; --ai: #1b3a53; --ai-ink: #dbeaf7;
    --memory: #63c6a6; --memory-bg: #10322a; --skill: #96a2ee; --skill-bg: #1c2145;
    --flag: #e9a184; --flag-bg: #3a201a;
  }

  body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; }
  .wrap { max-width: 900px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 56px; }
  h1 { font-family: var(--serif); font-size: clamp(28px, 4.4vw, 40px); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
  h2 { font-family: var(--serif); font-size: 22px; margin: 0; }
  h3 { font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
  p { margin: 0; }
  .kicker { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .lede { color: var(--ink-2); max-width: 60ch; margin-top: 10px; font-size: 17px; }

  /* the headline result, visible before any scrolling */
  .result { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 22px 0 8px; }
  @media (max-width: 620px) { .result { grid-template-columns: minmax(0, 1fr); } }
  .result div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .result .when { font-size: 13px; color: var(--ink-3); }
  .result .line { margin-top: 6px; font-size: 15px; color: var(--ink-2); }
  .result b { font-family: var(--serif); font-size: 30px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .result .win b { color: var(--memory); }

  .day { margin-top: 30px; }
  .day > header { display: flex; align-items: baseline; gap: 10px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
  .day > header .num { font-family: var(--serif); font-size: 15px; color: var(--ink-3); }
  .chat { background: var(--surface); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 12px 12px;
          padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .chat + .chat { margin-top: 14px; border-top: 1px solid var(--line); border-radius: 12px; }
  .clock { font-size: 12px; color: var(--ink-3); letter-spacing: 0.06em; }
  .bubble { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 15.5px; }
  .them { align-self: flex-end; background: var(--them); border: 1px solid var(--line); border-bottom-right-radius: 4px; }
  .ai { align-self: flex-start; background: var(--ai); color: var(--ai-ink); border-bottom-left-radius: 4px; }
  .correction { border: 1px solid var(--flag); background: var(--flag-bg); color: var(--flag); }
  .act { align-self: flex-start; display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; color: var(--ink-3);
         background: var(--surface-2); border-radius: 999px; padding: 6px 12px; max-width: 92%; }
  .act .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .act .detail { color: var(--ink-2); }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 2px; }
  .tag { font-size: 12px; border-radius: 999px; padding: 3px 9px; background: var(--surface-2); color: var(--ink-3); }
  .tag.warn { background: var(--flag-bg); color: var(--flag); }

  .wrote { margin-top: 14px; border: 1px solid var(--line); border-left: 4px solid var(--memory);
           background: var(--surface); border-radius: 0 12px 12px 0; padding: 14px 16px; }
  .wrote.quiet { border-left-color: var(--line); }
  .wrote > .head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .wrote .what { font-size: 15px; color: var(--ink-2); }
  .note { border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-top: 8px; }
  .note.mem { background: var(--memory-bg); border-left: 3px solid var(--memory); }
  .note.skl { background: var(--skill-bg); border-left: 3px solid var(--skill); }
  .note .title { font-weight: 600; color: var(--skill); }
  .note .kind { font-size: 12px; color: var(--ink-3); display: block; margin-bottom: 2px; }
  .note ol { margin: 6px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 14.5px; }
  .note .matters { margin-top: 6px; font-size: 14.5px; color: var(--ink-2); }
  .note.mem .kind { color: var(--memory); }

  .finale { margin-top: 34px; }
  .finale .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
  @media (max-width: 720px) { .finale .grid { grid-template-columns: minmax(0, 1fr); } }
  .side { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px;
          display: flex; flex-direction: column; gap: 9px; }
  .side .bubble { max-width: 100%; font-size: 15px; }
  .side .foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-3); }

  .how { margin-top: 30px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 720px) { .how { grid-template-columns: minmax(0, 1fr); } }
  .how div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .how b { display: block; margin-bottom: 4px; }
  .how p { font-size: 14.5px; color: var(--ink-2); }
  footer { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; color: var(--ink-3); font-size: 14px; }
  footer a { color: var(--skill); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
